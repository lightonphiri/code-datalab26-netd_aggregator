# Builds the manual (docs/manual, mkdocs.yml) and publishes it to the gh-pages branch for GitHub Pages.
name: manual
on:
  push:
    branches: [main]
    paths: ["docs/manual/**", "docs/SRS.md", "docs/SDD.md", "docs/mkdocs_hooks.py", "mkdocs.yml", ".github/workflows/manual.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install "mkdocs>=1.6,<2" "mkdocs-material>=9.5,<10"
      - run: mkdocs gh-deploy --strict --force --no-history
