# netd.ac.zm over HTTPS: the Zambia National ETD Portal (NETD v2, Blacklight on Puma :3010).
# Installed by deploy/deploy.sh (previous file backed up in /opt/netd/).
<IfModule mod_ssl.c>
<VirtualHost *:443>
        ServerName netd.ac.zm
        ServerAlias www.netd.ac.zm
        ServerAdmin lighton.phiri@unza.zm
        DocumentRoot /var/www/html
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        ProxyRequests Off
        ProxyPreserveHost On
        RequestHeader set X-Forwarded-Proto "https"

        # Former /beta address and the retired ETD Portal (Tomcat) pages -> new portal
        RedirectMatch 301 ^/beta/?(.*)$ /$1
        RedirectMatch 301 ^/(portal|summary|harvester)(/.*)?$ /

        # (exclusions so the redirects above win over the catch-all proxy below)
        ProxyPass /beta !
        ProxyPass /portal !
        ProxyPass /summary !
        ProxyPass /harvester !

        # Still served from /var/www/html (other projects) and certificate renewals
        ProxyPass /.well-known !
        ProxyPass /znrp !
        ProxyPass /ojs !

        ProxyPass / http://127.0.0.1:3010/
        ProxyPassReverse / http://127.0.0.1:3010/

        SSLEngine on
        SSLCertificateFile /etc/letsencrypt/live/netd.ac.zm/fullchain.pem
        SSLCertificateKeyFile /etc/letsencrypt/live/netd.ac.zm/privkey.pem
        Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
