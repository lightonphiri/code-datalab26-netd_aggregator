# netd.ac.zm over HTTP: redirect everything to HTTPS, except Let's Encrypt renewals.
# Installed by deploy/deploy.sh (previous file backed up in /opt/netd/).
<VirtualHost *:80>
        ServerName netd.ac.zm
        ServerAlias www.netd.ac.zm
        ServerAdmin lighton.phiri@unza.zm
        DocumentRoot /var/www/html
        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined

        RewriteEngine On
        RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
        RewriteRule ^/(.*)$ https://netd.ac.zm/$1 [R=301,L]
</VirtualHost>
