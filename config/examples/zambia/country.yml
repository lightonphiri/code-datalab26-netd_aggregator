# NETD country configuration: the identity of this installation (packaging release P3, November 4, 2026).
# Read once at start-up by the portal (portal/config/netd_country.rb), the harvester (harvester/netd/config.py)
# and the deployment scripts (deploy/site.env, written by deploy/deploy.sh). Override the path with NETD_COUNTRY.
# A new installation copies an example from config/examples/ and edits it; see manual chapter 7.
country:
  name: Zambia
  adjective: Zambian
  time_zone: Africa/Lusaka          # IANA name; admin and quality times are shown in it
portal:
  name: Zambia National ETD Portal
  wordmark: [Zambia, National ETD Portal]
  host: netd.ac.zm                  # public host name, served over HTTPS
  theme: zambia                     # folder in themes/: colours, wordmark font, logos (default: default)
regulator:                          # the body that accredits the institutions; named on the home, FAQ and admin pages
  name: Higher Education Authority
  short_name: HEA
  url: https://www.hea.org.zm        # linked from the home and FAQ pages and given as the source of /api/v1/institutions
  register_url: https://online.hea.org.zm
contact:
  email: datalab@unza.zm            # public contact shown on the pages, in OAI-PMH Identify and the API description
  reports_to: [lighton.phiri@unza.ac.zm, datalab@unza.zm]   # recipients of "Report a problem"
mail:
  from: datalab@unza.zm             # default sender of portal e-mail
  sender: lighton.phiri@unza.ac.zm  # sender of problem reports when SMTP_FROM and SMTP_USER are not set
# Credits in the header bar, footer, About and Credits pages, in this order. role "developed by" is the group named in the
# header bar and footer; role "hosted by" provides the server. full_name is shown after the name where given; logo is a file
# in themes/<portal.theme>/public/images/ (or portal/public/images/), logo_height its height in pixels on the About and Credits pages,
# class the style class of the logo link, article a word put before the name in running text ("developed by the ...").
credits:
  - {name: DataLab Research Group, url: https://datalab.unza.zm, logo: datalab-logo-light.svg, logo_height: 40,
     class: datalab-credit, article: the, role: developed by}
  - {name: ZAMREN, full_name: Zambia Research and Education Network, url: https://zamren.zm, logo: zamren-logo.png,
     logo_height: 48, class: zamren-credit, role: hosted by}
# Words kept capitalised when a title in capitals is put into sentence case for citations, added to the general list
# in portal/app/models/citation.rb (Africa, HIV, UN, Roman numerals and so on): places, institutions and bodies.
citation:
  keep_capitals: [Zambia, Zambian, Zambians, Lusaka, Copperbelt, Luapula, Muchinga, Ndola, Kitwe, Kabwe, Livingstone,
                  Chipata, Kasama, Solwezi, Mongu, Mansa, Chongwe, UNZA, ZESCO, ZRA, ZNBC]
locale: en
