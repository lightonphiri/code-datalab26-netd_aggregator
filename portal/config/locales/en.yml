      learn_more: "Learn more →"
      masters_title_html: "Explore Master's Manuscripts"
      # %{n}: number of master's records
      masters_text_html: "Browse %{n} master's dissertations and theses, filter by institution, faculty, subject and year, and download the full text where the repository provides it."
      doctoral_title_html: "Explore PhD Manuscripts"
      # %{n}: number of doctoral records
      doctoral_text_html: "Browse %{n} doctoral theses from %{country_adjective} universities, with direct links to the full text held in each institutional repository."
      stats_html: "Stats at a glance"
      stat_total: "total ETDs"
      stat_masters: "master's"
      stat_doctoral: "doctoral"
      stat_pdf: "with full-text PDF"
      # %{n} of %{total} institutions
      stat_institutions_count_html: "%{n} of %{total}"
      stat_institutions_html: "institutions contributing"
      stat_years_html: "years covered"
      # %{n}: records without a degree level
      no_level_html: "%{n} ETDs do not yet state their degree level in the source repository."
      newest: "Newest additions"
      follow_title: "Feeds of new additions, for a feed reader or email"
      follow_html: "follow new additions"
      contributing_html: "Contributing institutions"
      # %{n}: number of listed institutions; %{regulator_link}: the regulator's name linked to its website
      harvest_note_html: "Metadata is meant to be harvested from all <strong>%{n}</strong> institutions offering Master's and PhD programmes accredited by the %{regulator_link}."
      # %{n}: institutions with no records yet
      show_waiting_html: "Show the %{n} not yet harvested »"
      hide_waiting_html: "« Hide"
      # %{link}: link to the For Institutions page, with the text of listed_zero_link
      listed_zero_html: "Is your institution listed with 0? %{link}."
      listed_zero_link: "Here is how to add its theses and dissertations"

    # Shared by several pages
    common:
      back_to_search: "← Back to search"

    about:
      # %{name}: the project name (publications.yml)
      page_title: "About — %{name}"
      heading_html: "About the %{name}"
      # Followed by the developer from config/country.yml
      developed_by_html: "Developed by"
      # Followed by the host from config/country.yml
      hosted_by_html: ", and hosted by"
      hosted_role_html: ", which provides the server space for the portal."
      # %{link}: link to the Credits page, with the text of see_credits_link
      see_credits_html: "See also the %{link}."
      see_credits_link: "credits"
      # %{link}: the project page address
      project_page_html: "Project page: %{link}"
      project_members_html: "Project members"
      # link1: link to "%{portal} project"
      publications_based_on_the_html: "Publications based on the %{link1}"
      publications_based_on_the_link1: "%{portal} project"
      # link1: link to "%{portal} project"
      the_publications_dissertations_and_html: "The publications, dissertations and capstone reports below come out of the %{link1}. They study the visibility of %{country_adjective} research, the quality, completeness and ETD-MS compliance of ETD metadata in institutional repositories, and ways of improving it; their findings shaped how this portal harvests, cleans and presents ETD metadata."
      the_publications_dissertations_and_link1: "%{portal} project"

    credits:
