# Interface text of the portal (packaging step P4; SRS NFR-15, SDD 8.1, manual 8.6).
#
# Templates read these keys with the helper nt('area.key'), which looks up netd.area.key and adds the country
# configuration's values (config/country.yml) for interpolation:
#   %{portal}             portal name                    %{country}           country name
#   %{country_adjective}  "Zambian" in "Zambian universities"
#   %{regulator}          regulator's full name          %{regulator_short}   regulator's short name
#   %{email}              public contact address         %{host}, %{base_url} the portal's host name and address
# Some keys take their own values as well (%{n}, %{link}, ...); the comment above the key says so.
#
# Keys ending in _html hold HTML: write & as &amp; and do not use < or > except in tags. Interpolated values are
# escaped unless the template marks them as HTML. Other keys are plain text and are escaped where they are shown.
# A second language is a copy of this file with the same keys (for example fr.yml under fr:); see manual 8.6.
# Quote every value (YAML reads yes, no, on and off as true or false).
#
# Moved into this file so far: header, footer and home page (P4a); About, Credits, FAQ, For Institutions, Developer
# Resources and the REST API reference (P4b); Browse by Faculty, Follow a search, Metadata Quality and the "Follow
# this search" button (P4c). The search results and record pages and the administration pages follow later.

en:
  netd:
    header:
      search: "Search"
      search_placeholder: "Search theses and dissertations…"
      nav_label: "Main"
      about_html: "About"
      explore_html: "Explore"
      browse_html: "Browse by Faculty"

    footer:
      nav_label: "Footer"
      about: "About"
      faq: "FAQ"
      developers: "Developer Resources"
      contribute: "For Institutions"
      quality: "Metadata Quality"
      credits: "Credits"
      admin_html: "Administration"
      admin_title: "Sign in to the administration panel (portal and %{regulator_short} staff)"
      text_html: "The %{portal} provides access to theses and dissertations from %{country_adjective} universities and higher education institutions."
      # Followed by the credits of config/country.yml: "It is developed by X and hosted by Y."
      credits_intro_html: "It is"
      credits_separator_html: ", "
      credits_last_html: "and"

    home:
