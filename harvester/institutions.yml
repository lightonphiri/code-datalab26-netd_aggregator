# Institutions expected to contribute ETDs: every Higher Education Institution with at least one
# HEA-accredited Master's or Doctoral programme. Shown on the portal home page and in the
# Institution facet, with 0 where nothing has been harvested yet.
#
# Sources (checked October 31, 2026):
#  - HEA accredited learning programmes data behind https://online.hea.org.zm (1,966 programmes)
#  - Special Gazette No. 61 of 2025 (Gazette Notice No. 506 of 2025), public HEIs, text-searchable:
#    https://online.hea.org.zm/resources?doc=Special_Gazette_No._61_of_2025_-_The_Higher_Education_Authority
#  - Gazette No. 7965 of 2026, Accredited Learning Programmes (scanned PDF; not machine-readable):
#    https://online.hea.org.zm/resources?doc=HIGHER_EDUCATION_AUTHORITY_-_GAZETTE_NO._7965_OF_2026_-_ACCREDITED_LEARNING_PROGRAMMES
#
# name:   exactly as used by HEA (and as the `name` of the matching entry in sources.yml)
# levels: postgraduate levels with accredited programmes
# source: id in sources.yml when the institution is harvested
# status: harvested (OAI-PMH, a fallback loader, or a CSV file: loader csv in sources.yml) | no-etds-yet (ETD collection
#         exists but holds no postgraduate theses) | no-etd-collection | repository-unreachable (not reachable from the
#         portal's server, or OAI-PMH not usable) | no-repository-known
# repository: public repository URL, when known
# oai, etd_sets: OAI-PMH base URL and the sets holding ETDs; checked weekly by `netd.cli check-repositories` (FR-58)
# checked, note: date of the last manual check and what was found (session 04 survey: November 1, 2026,
#   starting from the ten DSpace repositories listed by Chisale (2024), SRS [R6], and probing likely host names)

institutions:
  - {name: Africa Research University, levels: [Masters, PhD], status: no-repository-known}
  - {name: Berea Theological University, levels: [Masters], status: no-repository-known}
  - {name: Cavendish University, levels: [Masters, PhD], status: repository-unreachable,
     repository: "https://dspace.cavendishza.org/", checked: "2026-11-01",
     note: "DSpace (Chisale 2024); every path answers 403 Forbidden to outside visitors"}
  - {name: Central Africa Baptist University, levels: [Masters], status: no-repository-known}
  - {name: Chalimbana University, levels: [Masters], status: repository-unreachable,
     repository: "http://dspace.chau.ac.zm:8080/xmlui/", oai: "http://dspace.chau.ac.zm:8080/oai/request", checked: "2026-11-01",
     note: "DSpace linked from chau.ac.zm; connections from the portal server time out. Chisale (2024) found 10 ETDs in October 2022"}
  - {name: Chreso University, levels: [Masters], status: no-repository-known, checked: "2026-11-01",
     note: "Website page Research Reports/Thesis (https://chresouniversity.edu.zm/research-reports-thesis-3/) has no list; CSV route"}
  - {name: Copperbelt University, levels: [Masters, PhD], status: repository-unreachable,
     repository: "https://dspace.cbu.ac.zm/home", oai: "https://dspace.cbu.ac.zm/server/oai/request", checked: "2026-11-01",
     note: "DSpace 7 linked from the CBU Library site; user interface 502 Bad Gateway, REST API and OAI-PMH 404"}
  - {name: Copperstone University, levels: [Masters], status: no-repository-known}
  - {name: DMI-St. Eugene University, levels: [Masters, PhD], status: no-repository-known}
  - {name: Eden University, levels: [Masters], status: no-etds-yet,
     repository: "https://dspace.edenuniversity.edu.zm/home", oai: "https://dspace.edenuniversity.edu.zm/server/oai/request",
     etd_sets: [com_123456789_8], checked: "2026-11-01",
