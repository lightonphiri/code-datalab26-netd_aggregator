# Institutions expected to contribute ETDs: every Higher Education Institution with at least one
# HEA-accredited Master's or Doctoral programme. Shown on the portal home page and in the
# Institution facet, with 0 where nothing has been harvested yet.
#
# Sources (checked October 31, 2026):
#  - HEA accredited learning programmes data behind https://online.hea.org.zm (1,966 programmes)
#  - Special Gazette No. 61 of 2025 (Gazette Notice No. 506 of 2025), public HEIs, text-searchable:
#    https://online.hea.org.zm/resources?doc=Special_Gazette_No._61_of_2025_-_The_Higher_Education_Authority
#  - Gazette No. 7965 of 2026, Accredited Learning Programmes (scanned PDF; not machine-readable):
#    https://online.hea.org.zm/resources?doc=HIGHER_EDUCATION_AUTHORITY_-_GAZETTE_NO._7965_OF_2026_-_ACCREDITED_LEARNING_PROGRAMMES
#
# name:   exactly as used by HEA (and as the `name` of the matching entry in sources.yml)
# levels: postgraduate levels with accredited programmes
# source: id in sources.yml when the institution is harvested
# status: harvested (OAI-PMH, a fallback loader, or a CSV file: loader csv in sources.yml) | no-etd-collection | repository-unreachable | no-repository-known
# repository: public repository URL, when known

institutions:
