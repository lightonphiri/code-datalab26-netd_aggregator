# Source registry: one entry per Higher Education Institution (HEI) repository.
# The harvester requests the first metadata format in `formats` that the source offers.
# `sets` restricts harvesting to ETD collections/communities (OAI-PMH setSpec values).
# `ignore_set_names` are community/collection names that are containers, not
# faculties/departments, so they are not used when deriving Faculty/Department.

# Scope (SRS FR-47): the portal holds postgraduate work only. A record whose degree level is identified
# (from the repository or from its degree, type or description text) as anything else is left out when
# processing; records whose level cannot be identified are kept. The raw harvested record is never deleted,
# and every exclusion is listed by `netd.cli report` and on the admin panel's source page.
# Individual records can also be excluded per source with `exclude_records` (oai_id and reason).
scope:
  degree_levels: [Doctoral, Masters, Postgraduate Diploma]

sources:
  - id: unza
    name: University of Zambia
    short_name: UNZA
    base_url: https://rims.unza.ac.zm/server/oai/request
    formats: [dim, etdms, oai_dc]
    sets: [com_123456789_18, col_123456789_6021]
    ignore_set_names: ["Theses and Dissertations", "Medical Theses and Dissertations",
                       "African Digital Health Library (ADHL) - Zambia"]
    # RIMS ETD collections are the Schools (e.g. "Natural Sciences"), so map them to Faculty.
    collections_are: faculty
    # Collections that are not Schools (FR-62; checked November 2, 2026): single theses filed in a journal or
    # project collection, so their School is left for the title page to supply. "Library" (col_123456789_99) stays:
    # the Library is a separate entity at UNZA, not part of a School (Lighton, November 2, 2026).
    set_units:
      col_123456789_5183: {faculty: null}   # Medical Journal of Zambia
      col_123456789_6038: {faculty: null}   # Students' Projects/Research Reports
    exclude_records:
      - oai_id: "oai:rims.unza.ac.zm:123456789/8053"
        reason: "Bachelor of Laws dissertation deposited in the Theses and Dissertations community (checked by L. Phiri, November 1, 2026)"
      - oai_id: "oai:rims.unza.ac.zm:123456789/5434"
        reason: "Not a thesis: National Health-Care Waste Management Plan 2015-2019 (Ministry of Health), in the Theses and Dissertations community (checked November 2, 2026)"

  - id: unilus
    name: University of Lusaka
    short_name: UNILUS
    base_url: https://research.unilus.ac.zm/server/oai/request
    formats: [dim, etdms, oai_dc]
    sets: [com_123456789_41]
    ignore_set_names: ["Theses and Dissertations Collection", "SCHOOL OF POSTGRADUATE STUDIES",
                       "MASTER'S THESES", "PHD/DBA THESES"]
    # UNILUS ETD collections are degree levels, not units; Faculty/Department need text/PDF extraction.

  - id: zcas
    name: ZCAS University
    short_name: ZCASU
    base_url: https://dspace.zcas.edu.zm/server/oai/request
    # OAI-PMH answers but its index is empty (noRecordsMatch for every set on October 31, 2026),
    # so items are read from the DSpace 7 REST API instead. Switch back to OAI-PMH once ZCAS
    # rebuilds its OAI index (dspace oai import) by removing `loader`.
    loader: dspace7-rest
    rest_api: https://dspace.zcas.edu.zm/server/api
    # DBA Thesis + the four School "Dissertations" collections; Schools are parent communities (-> Faculty)
    collections: [123456789/12, 123456789/13, 123456789/16, 123456789/19, 123456789/22]
    sets: [col_123456789_12, col_123456789_13, col_123456789_16, col_123456789_19, col_123456789_22]
    ignore_set_names: ["DBA Thesis", "Dissertations"]

  - id: mu
    name: Mulungushi University
    short_name: MU
    base_url: https://space.mu.ac.zm/oai/request
    # DSpace 6.3 with OAI-PMH and REST switched off (October 31, 2026): items are listed from the
    # collection's browse pages and read from each item's public METS export (dim metadata).
    loader: dspace6-mets
    xmlui: https://space.mu.ac.zm/xmlui
    collections: [123456789/56]
    sets: [col_123456789_56]
    ignore_set_names: ["Theses and Dissertations"]
